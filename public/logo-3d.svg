
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" fill="none">
  <defs>
    <!-- Gold Gradient for 3D face -->
    <linearGradient id="goldFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF677" />
      <stop offset="25%" stop-color="#FFDC1A" />
      <stop offset="55%" stop-color="#FAB800" />
      <stop offset="85%" stop-color="#E09B00" />
      <stop offset="100%" stop-color="#FDD835" />
    </linearGradient>

    <!-- Gold Bevel Gradient -->
    <linearGradient id="goldBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9A6" />
      <stop offset="30%" stop-color="#FFE033" />
      <stop offset="70%" stop-color="#B26A00" />
      <stop offset="100%" stop-color="#5E3600" />
    </linearGradient>

    <!-- Extrusion / 3D Side Shadow Gradient -->
    <linearGradient id="goldSide" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D48800" />
      <stop offset="40%" stop-color="#A36200" />
      <stop offset="80%" stop-color="#6E3E00" />
      <stop offset="100%" stop-color="#422100" />
    </linearGradient>

    <!-- White metallic 3D gradient for subtitle -->
    <linearGradient id="white3DFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Glow & 3D Shadow Filters -->
    <filter id="drop3D" x="-15%" y="-15%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur" />
      <feOffset dx="0" dy="9" result="offset" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.55" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subDrop" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@900&amp;display=swap');
      .title-3d {
        font-family: 'Anton', 'Impact', 'Arial Black', sans-serif;
        font-size: 195px;
        font-weight: 900;
        letter-spacing: 2.5px;
      }
      .sub-3d {
        font-family: 'Montserrat', 'Plus Jakarta Sans', sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 4px;
      }
    </style>
  </defs>

  <!-- ================= TRANSMISSION TOWER 3D ICON ================= -->
  <g filter="url(#drop3D)">
    <!-- 3D Extrusion base for Tower -->
    <g transform="translate(3, 8)" fill="none" stroke="url(#goldSide)" stroke-linecap="round" stroke-linejoin="round">
      <!-- Top apex triangle -->
      <polygon points="100,28 78,70 122,70" stroke-width="12" />
      <!-- Legs & Body -->
      <line x1="78" y1="70" x2="65" y2="118" stroke-width="12" />
      <line x1="122" y1="70" x2="135" y2="118" stroke-width="12" />
      <line x1="65" y1="118" x2="135" y2="118" stroke-width="10" />
      <line x1="78" y1="70" x2="135" y2="118" stroke-width="8" />
      <line x1="122" y1="70" x2="65" y2="118" stroke-width="8" />

      <line x1="28" y1="118" x2="172" y2="118" stroke-width="14" />
      <line x1="38" y1="118" x2="38" y2="138" stroke-width="8" />
      <line x1="162" y1="118" x2="162" y2="138" stroke-width="8" />
      <line x1="28" y1="118" x2="75" y2="160" stroke-width="9" />
      <line x1="172" y1="118" x2="125" y2="160" stroke-width="9" />

      <line x1="75" y1="118" x2="68" y2="172" stroke-width="11" />
      <line x1="125" y1="118" x2="132" y2="172" stroke-width="11" />
      <line x1="68" y1="172" x2="132" y2="172" stroke-width="10" />
      <line x1="68" y1="118" x2="132" y2="172" stroke-width="8" />
      <line x1="132" y1="118" x2="68" y2="172" stroke-width="8" />

      <line x1="12" y1="172" x2="188" y2="172" stroke-width="16" />
      <line x1="22" y1="172" x2="22" y2="196" stroke-width="8" />
      <line x1="46" y1="172" x2="46" y2="196" stroke-width="8" />
      <line x1="154" y1="172" x2="154" y2="196" stroke-width="8" />
      <line x1="178" y1="172" x2="178" y2="196" stroke-width="8" />
      <line x1="12" y1="172" x2="56" y2="226" stroke-width="9" />
      <line x1="188" y1="172" x2="144" y2="226" stroke-width="9" />

      <line x1="65" y1="172" x2="42" y2="246" stroke-width="13" />
      <line x1="135" y1="172" x2="158" y2="246" stroke-width="13" />
      <line x1="53" y1="208" x2="147" y2="208" stroke-width="9" />
      <line x1="65" y1="172" x2="158" y2="246" stroke-width="8" />
      <line x1="135" y1="172" x2="42" y2="246" stroke-width="8" />
      <line x1="18" y1="246" x2="182" y2="246" stroke-width="15" />
    </g>

    <!-- Top Metallic Golden Face for Tower -->
    <g fill="none" stroke="url(#goldFace)" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="100,28 78,70 122,70" stroke-width="11" />
      <line x1="78" y1="70" x2="65" y2="118" stroke-width="11" />
      <line x1="122" y1="70" x2="135" y2="118" stroke-width="11" />
      <line x1="65" y1="118" x2="135" y2="118" stroke-width="9.5" />
      <line x1="78" y1="70" x2="135" y2="118" stroke-width="7.5" />
      <line x1="122" y1="70" x2="65" y2="118" stroke-width="7.5" />

      <line x1="28" y1="118" x2="172" y2="118" stroke-width="13" />
      <line x1="38" y1="118" x2="38" y2="138" stroke-width="7" />
      <line x1="162" y1="118" x2="162" y2="138" stroke-width="7" />
      <line x1="28" y1="118" x2="75" y2="160" stroke-width="8" />
      <line x1="172" y1="118" x2="125" y2="160" stroke-width="8" />

      <line x1="75" y1="118" x2="68" y2="172" stroke-width="10.5" />
      <line x1="125" y1="118" x2="132" y2="172" stroke-width="10.5" />
      <line x1="68" y1="172" x2="132" y2="172" stroke-width="9.5" />
      <line x1="68" y1="118" x2="132" y2="172" stroke-width="7.5" />
      <line x1="132" y1="118" x2="68" y2="172" stroke-width="7.5" />

      <line x1="12" y1="172" x2="188" y2="172" stroke-width="15" />
      <line x1="22" y1="172" x2="22" y2="196" stroke-width="7" />
      <line x1="46" y1="172" x2="46" y2="196" stroke-width="7" />
      <line x1="154" y1="172" x2="154" y2="196" stroke-width="7" />
      <line x1="178" y1="172" x2="178" y2="196" stroke-width="7" />
      <line x1="12" y1="172" x2="56" y2="226" stroke-width="8" />
      <line x1="188" y1="172" x2="144" y2="226" stroke-width="8" />

      <line x1="65" y1="172" x2="42" y2="246" stroke-width="12" />
      <line x1="135" y1="172" x2="158" y2="246" stroke-width="12" />
      <line x1="53" y1="208" x2="147" y2="208" stroke-width="8.5" />
      <line x1="65" y1="172" x2="158" y2="246" stroke-width="7.5" />
      <line x1="135" y1="172" x2="42" y2="246" stroke-width="7.5" />
      <line x1="18" y1="246" x2="182" y2="246" stroke-width="14" />
    </g>
  </g>

  <!-- ================= 3D 'CAT ENERGY' MAIN TITLE ================= -->
  <g filter="url(#drop3D)">
    <!-- Deep bottom extrusion 4 -->
    <text x="225" y="209" class="title-3d" fill="#3D1E00">CAT ENERGY</text>
    <!-- Deep bottom extrusion 3 -->
    <text x="225" y="206" class="title-3d" fill="#613400">CAT ENERGY</text>
    <!-- Middle side extrusion 2 -->
    <text x="225" y="203" class="title-3d" fill="#995600">CAT ENERGY</text>
    <!-- Upper bevel extrusion 1 -->
    <text x="225" y="200" class="title-3d" fill="#C77C00">CAT ENERGY</text>
    <!-- Border highlight -->
    <text x="225" y="197" class="title-3d" fill="none" stroke="#FFEFA6" stroke-width="5" stroke-linejoin="round">CAT ENERGY</text>
    <!-- Top luminous gold face -->
    <text x="225" y="197" class="title-3d" fill="url(#goldFace)">CAT ENERGY</text>
  </g>

  <!-- ================= 3D SUBTITLE: AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA ================= -->
  <g filter="url(#subDrop)">
    <!-- Deep 3D Shadow layer -->
    <text x="30" y="304" class="sub-3d" textLength="1140" lengthAdjust="spacingAndGlyphs" fill="#0F172A">AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA</text>
    <!-- Side bevel layer -->
    <text x="30" y="301" class="sub-3d" textLength="1140" lengthAdjust="spacingAndGlyphs" fill="#64748B">AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA</text>
    <!-- Top Face (3D silver/white embossed) -->
    <text x="30" y="298" class="sub-3d" textLength="1140" lengthAdjust="spacingAndGlyphs" fill="url(#white3DFace)">AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA</text>
  </g>
</svg>
