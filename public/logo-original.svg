
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" width="1000" height="270" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Montserrat:wght@800;900&amp;display=swap');
      .brand-title {
        font-family: 'Anton', 'Impact', 'Arial Black', sans-serif;
        font-size: 168px;
        font-weight: 900;
        letter-spacing: 2px;
      }
      .brand-sub {
        font-family: 'Montserrat', 'Plus Jakarta Sans', 'Arial', sans-serif;
        font-size: 32px;
        font-weight: 900;
        letter-spacing: 3.5px;
      }
    </style>
  </defs>

  <!-- TRANSMISSION TOWER ICON (Exact geometry from original logo) -->
  <g stroke="#FFC200" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top lightning rod / finial -->
    <line x1="80" y1="10" x2="80" y2="22" stroke-width="8" />
    
    <!-- Top apex triangle -->
    <polygon points="80,22 62,56 98,56" stroke-width="9" fill="none" />
    
    <!-- Top trapezoid body with X brace -->
    <line x1="62" y1="56" x2="52" y2="95" stroke-width="9" />
    <line x1="98" y1="56" x2="108" y2="95" stroke-width="9" />
    <line x1="52" y1="95" x2="108" y2="95" stroke-width="8" />
    <line x1="62" y1="56" x2="108" y2="95" stroke-width="6.5" />
    <line x1="98" y1="56" x2="52" y2="95" stroke-width="6.5" />

    <!-- Upper crossarm -->
    <line x1="22" y1="95" x2="138" y2="95" stroke-width="11" />
    <!-- Upper crossarm insulator points hanging down -->
    <line x1="30" y1="95" x2="30" y2="112" stroke-width="6" />
    <line x1="130" y1="95" x2="130" y2="112" stroke-width="6" />
    <!-- Upper crossarm diagonal braces -->
    <line x1="22" y1="95" x2="60" y2="130" stroke-width="7" />
    <line x1="138" y1="95" x2="100" y2="130" stroke-width="7" />

    <!-- Middle waist body with X brace -->
    <line x1="60" y1="95" x2="55" y2="140" stroke-width="9" />
    <line x1="100" y1="95" x2="105" y2="140" stroke-width="9" />
    <line x1="55" y1="140" x2="105" y2="140" stroke-width="8" />
    <line x1="55" y1="95" x2="105" y2="140" stroke-width="6.5" />
    <line x1="105" y1="95" x2="55" y2="140" stroke-width="6.5" />

    <!-- Lower crossarm (wider) -->
    <line x1="8" y1="140" x2="152" y2="140" stroke-width="12" />
    <!-- Lower crossarm insulators hanging down (4 points) -->
    <line x1="15" y1="140" x2="15" y2="160" stroke-width="6" />
    <line x1="35" y1="140" x2="35" y2="160" stroke-width="6" />
    <line x1="125" y1="140" x2="125" y2="160" stroke-width="6" />
    <line x1="145" y1="140" x2="145" y2="160" stroke-width="6" />
    <!-- Diagonal struts from lower arm to legs -->
    <line x1="8" y1="140" x2="45" y2="185" stroke-width="7" />
    <line x1="152" y1="140" x2="115" y2="185" stroke-width="7" />

    <!-- Lower body legs -->
    <line x1="52" y1="140" x2="34" y2="200" stroke-width="10" />
    <line x1="108" y1="140" x2="126" y2="200" stroke-width="10" />
    
    <!-- Lower body internal X lattice & crossbar -->
    <line x1="42" y1="170" x2="118" y2="170" stroke-width="7" />
    <line x1="52" y1="140" x2="126" y2="200" stroke-width="6.5" />
    <line x1="108" y1="140" x2="34" y2="200" stroke-width="6.5" />

    <!-- Ground base plate -->
    <line x1="14" y1="200" x2="146" y2="200" stroke-width="12" />
  </g>

  <!-- CAT ENERGY BRAND TITLE -->
  <text x="180" y="162" class="brand-title" fill="#FFC200">CAT ENERGY</text>

  <!-- SUBTITLE (Starts under tower, spans across to end of ENERGY) -->
  <text x="16" y="242" class="brand-sub" textLength="968" lengthAdjust="spacingAndGlyphs" fill="#000000">AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA</text>
</svg>
