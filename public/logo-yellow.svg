<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <!-- Pylon / Electrical Tower in Caterpillar Yellow #FAB800 -->
  <g id="tower" stroke="#FAB800" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top ground wire peak -->
    <polygon points="48,14 42,34 54,34" fill="#FAB800" />
    <line x1="48" y1="10" x2="48" y2="16" />
    
    <!-- Upper crossarm -->
    <line x1="26" y1="34" x2="70" y2="34" stroke-width="5" />
    <!-- Upper crossarm diagonal supports -->
    <line x1="26" y1="34" x2="42" y2="48" />
    <line x1="70" y1="34" x2="54" y2="48" />
    
    <!-- Middle body truss (X bracing) -->
    <line x1="39" y1="34" x2="35" y2="62" />
    <line x1="57" y1="34" x2="61" y2="62" />
    <line x1="39" y1="34" x2="61" y2="62" />
    <line x1="57" y1="34" x2="35" y2="62" />
    
    <!-- Main lower crossarm / boom with insulator strings hanging -->
    <line x1="16" y1="62" x2="80" y2="62" stroke-width="6" />
    <line x1="20" y1="62" x2="20" y2="72" stroke-width="3.5" />
    <line x1="76" y1="62" x2="76" y2="72" stroke-width="3.5" />
    <line x1="48" y1="62" x2="48" y2="72" stroke-width="3.5" />
    <line x1="16" y1="62" x2="33" y2="82" />
    <line x1="80" y1="62" x2="63" y2="82" />
    
    <!-- Lower body truss legs & lattice X -->
    <line x1="33" y1="62" x2="25" y2="98" stroke-width="5.5" />
    <line x1="63" y1="62" x2="71" y2="98" stroke-width="5.5" />
    <line x1="33" y1="62" x2="71" y2="98" />
    <line x1="63" y1="62" x2="25" y2="98" />
    <line x1="28" y1="80" x2="68" y2="80" stroke-width="3.5" />
    
    <!-- Base footing line -->
    <line x1="18" y1="98" x2="78" y2="98" stroke-width="6.5" />
  </g>

  <!-- CAT ENERGY Bold Condensed Text in #FAB800 -->
  <text x="100" y="78" font-family="'Impact', 'Arial Black', sans-serif" font-size="74" font-weight="900" letter-spacing="1.5" fill="#FAB800">
    CAT ENERGY
  </text>

  <!-- Subtitle in Dark/Black or Yellow -->
  <text x="102" y="106" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="14.5" font-weight="800" letter-spacing="2.2" fill="#FFFFFF">
    AUDITORIA, CONSULTORIA Y SERVICIOS EN ENERGIA
  </text>
</svg>
